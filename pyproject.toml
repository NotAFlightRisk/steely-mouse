[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalcfg-gui"
dynamic = ["version"]
description = "A web GUI for configuring SteelSeries mice, built on rivalcfg"
readme = ".github/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["flask>=3.0", "rivalcfg>=4.15"]

[project.scripts]
rivalcfg-gui = "rivalcfg_gui.__main__:main"

[project.urls]
Homepage = "https://github.com/Lissy93/steely-mouse"

[tool.setuptools]
packages = ["rivalcfg_gui"]

[tool.setuptools_scm]
version_file = "rivalcfg_gui/_version.py"
fallback_version = "0.0.0"

[tool.setuptools.package-data]
rivalcfg_gui = ["static/*", "templates/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["rivalcfg"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["UP031"]

# a local rivalcfg checkout would otherwise sort as first-party here but not in CI
[tool.ruff.lint.isort]
known-third-party = ["rivalcfg"]
