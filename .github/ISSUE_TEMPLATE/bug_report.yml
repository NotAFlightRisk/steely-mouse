name: 🐛 Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: I expected X, but Y happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reliably triggers it.
      placeholder: |
        1. Run '...'
        2. Send a request to '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you on? (release tag, commit SHA, or Docker tag)
      placeholder: 1.2.3
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running it?
      options:
        - Downloaded binary
        - pip, pipx or uv
        - Nix or NixOS
        - Docker
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your mouse, OS and browser, plus the Python version if you installed with pip.
      placeholder: Aerox 3 Wireless, Ubuntu 24.04, Firefox 141, Python 3.13
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Anything from the browser console or the terminal (`--log-level debug` adds more). Formatted as code automatically, so no backticks needed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am running the latest version
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/NotAFlightRisk/steely-mouse/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
