# Keeps a copy of the repo on Codeberg, for the non-Microsoft crowd.
# Does nothing until CODEBERG_SSH is set.
name: 🪞 Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'

permissions:
  contents: read

jobs:
  codeberg:
    name: 🪞 Sync to Codeberg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_KEY: ${{ secrets.CODEBERG_SSH != '' }}
    steps:
      - name: Say why we're skipping
        if: env.HAS_KEY != 'true'
        run: echo "::warning::CODEBERG_SSH isn't set, so there's nothing to mirror to."

      - name: Push to Codeberg
        if: env.HAS_KEY == 'true'
        uses: lissy93/repo-mirror-action@v1.6.0
        with:
          ssh_key: ${{ secrets.CODEBERG_SSH }}
          host: git@codeberg.org
          user: ${{ vars.CODEBERG_USER || github.repository_owner }}
          repo: steely-mouse
          force_push: false
