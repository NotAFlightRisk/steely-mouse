name: 🐋 Docker

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (blank for the newest)
        type: string
        required: false
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 🧭 Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.plan.outputs.image }}
      tag: ${{ steps.plan.outputs.tag }}
      created: ${{ steps.plan.outputs.created }}
      public: ${{ steps.plan.outputs.public }}
    steps:
      - name: Pick the tag to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref' \
              | sed 's#^refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          fi
          [ -n "$tag" ] || echo "::notice::No tags yet, so there's nothing to build."
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=$tag"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.emoji }} Build ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILD_ARGS: |
        VERSION=${{ needs.prepare.outputs.tag }}
        CREATED=${{ needs.prepare.outputs.created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest, emoji: '💻' }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm, emoji: '🦾' }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Note the revision
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          load: true
          tags: steely-mouse-scan:${{ matrix.arch }}
          provenance: false
          build-args: |
            ${{ env.BUILD_ARGS }}
            REVISION=${{ steps.src.outputs.sha }}
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          version: v0.76.2
          image-ref: steely-mouse-scan:${{ matrix.arch }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'schedule' && '1' || '0' }}
          format: sarif
          output: trivy-${{ matrix.arch }}.sarif
      - name: Upload the scan
        if: always() && needs.prepare.outputs.public == 'true' && hashFiles(format('trivy-{0}.sarif', matrix.arch)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.arch }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            ${{ env.BUILD_ARGS }}
            REVISION=${{ steps.src.outputs.sha }}
      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 🧩 Merge manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
      HAS_HUB: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HUB: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to DockerHub
        id: dockerhub
        if: env.HAS_HUB == 'true'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push the manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          PUSH_HUB: ${{ steps.dockerhub.outcome }}
        run: |
          set -euo pipefail
          repos=("$IMAGE")
          [ "$PUSH_HUB" = success ] && repos+=("${HUB,,}/${GITHUB_REPOSITORY##*/}")
          tags=()
          for repo in "${repos[@]}"; do
            tags+=(-t "$repo:$TAG" -t "$repo:${TAG%.*}" -t "$repo:latest")
          done
          sources=()
          for file in *; do sources+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "### 🐋 $TAG" >> "$GITHUB_STEP_SUMMARY"
          for repo in "${repos[@]}"; do echo "- \`$repo\`" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Generate an SBOM
        id: sbom
        if: needs.prepare.outputs.public == 'true'
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest the SBOM
        if: steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Attest the build provenance
        if: needs.prepare.outputs.public == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
