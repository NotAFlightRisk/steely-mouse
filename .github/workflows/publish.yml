name: 📡 Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to push to PyPI
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  pypi:
    name: 📡 Push to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the release's distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir dist
      - name: Upload to PyPI
        id: upload
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true
      - name: Summary
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$OUTCOME" = success ]; then
            echo "### ✅ [On PyPI](https://pypi.org/project/rivalcfg-gui/$TAG/)" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ PyPI didn't take it"
              echo "Needs a trusted publisher on PyPI for \`$GITHUB_REPOSITORY\`, workflow \`publish.yml\`, environment \`pypi\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
