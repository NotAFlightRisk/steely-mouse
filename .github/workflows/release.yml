name: 🚀 Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  PYTHON_VERSION: '3.13'

jobs:
  binaries:
    name: ${{ matrix.emoji }} Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, emoji: '🐧' }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, emoji: '🦾' }
          - { os: macos-15-intel, target: macos-x86_64, emoji: '🍎' }
          - { os: macos-latest, target: macos-arm64, emoji: '🍏' }
          - { os: windows-latest, target: windows-x86_64, emoji: '🪟', ext: '.exe' }
    env:
      BINARY: dist/rivalcfg-gui-${{ inputs.tag }}-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hidapi headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libhidapi-dev libudev-dev
      - name: Freeze it
        env:
          EXT: ${{ matrix.ext }}
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pip install . pyinstaller
          pyinstaller --clean --noconfirm rivalcfg-gui.spec
          mv "dist/rivalcfg-gui${EXT}" "$BINARY"
          ls -lh dist/
      - name: Check it starts
        run: |
          set -euo pipefail
          chmod +x "$BINARY"
          test "$("$BINARY" --version | tr -d '\r')" = "$TAG"
      - name: Check it serves
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          "./$BINARY" --port 8777 --no-browser --demo &
          for _ in $(seq 1 25); do
            if curl -fs http://127.0.0.1:8777/api/status | grep -q '"connected":true'; then
              kill %1
              exit 0
            fi
            sleep 1
          done
          echo "::error::the binary never served a mouse"
          kill %1
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.BINARY }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: 🚀 Publish the release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the Python distributions
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Checksum everything
        run: (cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)
      - name: Attest the build provenance
        id: attest
        if: github.event.repository.private == false
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/rivalcfg-gui-*
            dist/*.whl
            dist/*.tar.gz
          show-summary: false
      - name: Find the last feature release
        id: prev
        run: |
          prev=$(git tag --list '[0-9]*.0' | sort -V | awk -v cur="$TAG" '$0 == cur { exit } { last = $0 } END { print last }')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "$TAG" --verify-tag \
              --generate-notes ${PREV:+--notes-start-tag "$PREV"}
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
      - name: Send it to PyPI
        run: gh workflow run publish.yml -f tag="$TAG"
      - name: Summary
        env:
          ATTEST_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "### Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)"
            [ -n "$ATTEST_URL" ] && echo "Provenance: [attestation]($ATTEST_URL)"
            echo
            echo '```'
            (cd dist && ls -1)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
