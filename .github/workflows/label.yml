# Puts a label on each PR based on the conventional commit type in its title,
# which is what .github/release.yml groups the release notes by.
name: 🏷️ Label

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: 🏷️ Sort by Type
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Take the label off the conventional commit type
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          CURRENT: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          prefix=${TITLE%%:*}
          type=${prefix%%(*}
          case "${type%!}" in
            feat) wanted=enhancement ;;
            fix)  wanted=bug ;;
            docs) wanted=documentation ;;
            *)    wanted= ;;
          esac
          case "$prefix" in
            *'!') wanted="${wanted:+$wanted,}breaking-change" ;;
          esac

          args=()
          for label in enhancement bug documentation breaking-change; do
            on_pr=; want=
            case ",$CURRENT," in *",$label,"*) on_pr=yes ;; esac
            case ",$wanted,"  in *",$label,"*) want=yes ;; esac
            if [ -n "$want" ] && [ -z "$on_pr" ]; then
              # a repo that has never seen a breaking change won't have the label yet
              gh label create "$label" --color ededed >/dev/null 2>&1 || true
              args+=(--add-label "$label")
            elif [ -z "$want" ] && [ -n "$on_pr" ]; then
              args+=(--remove-label "$label")
            fi
          done

          if [ ${#args[@]} -gt 0 ]; then
            gh pr edit "$NUMBER" "${args[@]}"
          fi
          echo "### ${wanted:-no type label}" >> "$GITHUB_STEP_SUMMARY"
